[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS-Win - a resident AI assistant for Windows with a Textual TUI"
readme = "README.md"
authors = [
    { name = "simtfer", email = "20667469+simtfer@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.11.0",
    "psutil>=7.2.2",
    "textual>=8.2.8",
]

[project.scripts]
jarvis = "jarvis.tui.app:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
